name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # No package-lock.json yet — `npm install` writes one on first
        # run. Switch to `npm ci` once the lockfile is committed.
        run: npm install --no-audit --no-fund

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # First-run convenience: turn on GitHub Pages for this repo if
          # it has not been enabled yet, so a fresh fork/clone deploys
          # without manual repo-settings clicking.
          enablement: true

      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: https://lucky-sun-shine.com
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
