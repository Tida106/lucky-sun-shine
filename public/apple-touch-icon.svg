<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- iOS masks the icon to a rounded square, so paint a solid cream
       background then center an enlarged brand sun on top. -->
  <rect width="180" height="180" rx="36" fill="#FAF4E6"/>
  <g transform="translate(90,90)">
    <!-- Filled gold core -->
    <circle r="22" fill="#C9A96E"/>
    <!-- Thin rays — cardinal + diagonal -->
    <g stroke="#C9A96E" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="0"   y1="-72" x2="0"   y2="-46"/>
      <line x1="0"   y1="46"  x2="0"   y2="72"/>
      <line x1="-72" y1="0"   x2="-46" y2="0"/>
      <line x1="46"  y1="0"   x2="72"  y2="0"/>
      <line x1="-48" y1="-48" x2="-32" y2="-32"/>
      <line x1="32"  y1="32"  x2="48"  y2="48"/>
      <line x1="-48" y1="48"  x2="-32" y2="32"/>
      <line x1="32"  y1="-32" x2="48"  y2="-48"/>
    </g>
    <!-- Halo ring -->
    <circle r="38" fill="none" stroke="#C9A96E" stroke-width="2.4" opacity="0.45"/>
  </g>
  <text x="90" y="166" font-family="'Noto Serif JP', serif" font-size="14"
        font-weight="300" letter-spacing="2" text-anchor="middle" fill="#9C7A47">
    LUCKY SUN SHINE
  </text>
</svg>
