<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Gold-on-cream OG card matching the refreshed brand. -->
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FAF4E6"/>
      <stop offset="100%" stop-color="#F4E9D1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Brand sun mark -->
  <g transform="translate(170,200)">
    <circle r="42" fill="#C9A96E"/>
    <g stroke="#C9A96E" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="0"   y1="-138" x2="0"   y2="-86"/>
      <line x1="0"   y1="86"   x2="0"   y2="138"/>
      <line x1="-138" y1="0"   x2="-86" y2="0"/>
      <line x1="86"  y1="0"    x2="138" y2="0"/>
      <line x1="-95" y1="-95"  x2="-60" y2="-60"/>
      <line x1="60"  y1="60"   x2="95"  y2="95"/>
      <line x1="-95" y1="95"   x2="-60" y2="60"/>
      <line x1="60"  y1="-60"  x2="95"  y2="-95"/>
    </g>
    <circle r="76" fill="none" stroke="#C9A96E" stroke-width="3" opacity="0.45"/>
  </g>
  <!-- Wordmark + tagline -->
  <g transform="translate(360,180)">
    <text font-family="'Noto Serif JP', serif"
          font-size="84" font-weight="300" letter-spacing="6" fill="#6E5631">
      <tspan x="0" y="0">Lucky Sun Shine</tspan>
    </text>
    <text font-family="'Noto Sans JP', sans-serif"
          font-size="32" font-weight="500" fill="#3b322a">
      <tspan x="0" y="86">太陽のように明るい毎日を。</tspan>
    </text>
    <text font-family="'Noto Sans JP', sans-serif"
          font-size="26" fill="#6b5d50">
      <tspan x="0" y="160">パワーストーン・パワースポット・開運の総合メディア</tspan>
    </text>
    <text font-family="'Noto Sans JP', sans-serif"
          font-size="22" fill="#9C7A47" letter-spacing="2">
      <tspan x="0" y="220">lucky-sun-shine.com</tspan>
    </text>
  </g>
</svg>
